[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfstdlib"
version = "0.1.0"
description = "Terraform's built-in functions (format, regex, cidrsubnet, jsonencode, yamlencode, templatefile and more) in pure Python, checked against terraform console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kofiadeyemiq" }]
keywords = ["terraform", "hcl", "functions", "cidrsubnet", "iac"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/quietpelican42/tfstdlib"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tfstdlib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
strict = true
mypy_path = "src:tests"
